<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Análise de Arquivos · Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/index.css">
</head>
<body>
    <div class="bg-canvas" aria-hidden="true">
        <div class="bg-track"></div>
        <div class="bg-track secondary"></div>
        <div class="bg-track tertiary"></div>
        <div class="analysis-node"></div>
    </div>

    <section class="screen screen-login" id="screenLogin">
        <div class="login-card" id="loginCard">
            <div class="login-brand">
                <div class="login-brand-icon">
                    <span class="material-symbols-outlined">shield_person</span>
                </div>
                <h1>Bem-vindo</h1>
                <p>
                    <span>Acesse sua conta</span>
                    <span class="gold-dot">•</span>
                    <span>análise segura</span>
                </p>
            </div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label class="form-label" for="loginUser">Usuário</label>
                    <div class="form-field" id="fieldUserContainer">
                        <span class="material-symbols-outlined field-icon">person</span>
                        <input type="text" id="loginUser" placeholder="seu usuário" autocomplete="username" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="loginPass">Senha</label>
                    <div class="form-field" id="fieldPassContainer">
                        <span class="material-symbols-outlined field-icon">lock</span>
                        <input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" class="field-action" id="togglePass" aria-label="Mostrar senha">
                            <span class="material-symbols-outlined" id="togglePassIcon">visibility</span>
                        </button>
                    </div>
                </div>

                <div class="error-msg" id="errorMsg" aria-live="polite">
                    <span class="material-symbols-outlined">error</span>
                    <span id="errorText">Usuário ou senha inválidos.</span>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    <span>Entrar</span>
                    <span class="material-symbols-outlined">arrow_forward</span>
                </button>
            </form>
        </div>
    </section>

    <script src="js/index.js"></script>
</body>
</html>
