<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WorkFlow AI - Dashboard</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <header class="header">

        <strong>WorkFlow AI</strong>

        <button id="logout">
            Sair
        </button>

    </header>

    <main class="dashboard">

        <h1>Dashboard</h1>

        <div class="user-card">

            <p>
                Usuário:
                <strong id="userName">Carregando...</strong>
            </p>

            <p>
                E-mail:
                <strong id="userEmail">Carregando...</strong>
            </p>

        </div>

        <div class="cards">

            <div class="card">

                <h3>Documentos</h3>

                <strong>0</strong>

            </div>

            <div class="card">

                <h3>Processados</h3>

                <strong>0</strong>

            </div>

        </div>

    </main>

    <script src="js/dashboard.js"></script>

</body>

</html>
