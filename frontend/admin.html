<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WorkFlow AI · Administração</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="css/admin.css">
    <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
</head>
<body>
    <div class="bg-canvas" aria-hidden="true">
        <div class="bg-track"></div>
        <div class="bg-track secondary"></div>
        <div class="bg-track tertiary"></div>
        <div class="analysis-node"></div>
    </div>

    <div class="admin-container">
        <header class="admin-header">
            <div class="header-brand">
                <div class="brand-icon"><span class="material-symbols-outlined">admin_panel_settings</span></div>
                <div>
                    <h1>WorkFlow AI</h1>
                    <p>Painel Administrativo</p>
                </div>
            </div>
            <div class="header-actions">
                <button class="action-btn" id="backBtn"><span class="material-symbols-outlined">arrow_back</span> Voltar</button>
                <button class="action-btn" id="logoutBtn"><span class="material-symbols-outlined">logout</span> Sair</button>
            </div>
        </header>

        <main class="admin-main">
            <!-- Cards de Estatísticas -->
            <section class="stats-grid" id="statsGrid">
                <!-- Preenchido via JS -->
            </section>

            <!-- Gráficos -->
            <section class="charts-grid">
                <div class="chart-card">
                    <h3><span class="material-symbols-outlined">bar_chart</span> Documentos por Tipo</h3>
                    <div id="chartDocTypes"></div>
                </div>
                <div class="chart-card">
                    <h3><span class="material-symbols-outlined">pie_chart</span> Status dos Documentos</h3>
                    <div id="chartStatus"></div>
                </div>
            </section>

            <!-- Gerenciamento de Usuários -->
            <section class="users-section">
                <div class="section-header">
                    <h2><span class="material-symbols-outlined">group</span> Usuários</h2>
                    <button class="btn-primary" id="newUserBtn"><span class="material-symbols-outlined">person_add</span> Novo Usuário</button>
                </div>
                <div class="table-container" id="usersTableContainer">
                    <!-- Tabela via JS -->
                </div>
            </section>

            <!-- Logs -->
            <section class="logs-section">
                <div class="section-header">
                    <h2><span class="material-symbols-outlined">receipt_long</span> Logs Recentes</h2>
                </div>
                <div class="table-container" id="logsTableContainer">
                    <!-- Tabela via JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Modal de Novo Usuário -->
    <div class="modal-overlay" id="userModalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2><span class="material-symbols-outlined">person_add</span> Novo Usuário</h2>
                <button class="modal-close" id="closeUserModal"><span class="material-symbols-outlined">close</span></button>
            </div>
            <div class="modal-body">
                <form id="newUserForm">
                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" id="newUserName" required>
                    </div>
                    <div class="form-group">
                        <label>E-mail</label>
                        <input type="email" id="newUserEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Senha</label>
                        <input type="password" id="newUserPass" required minlength="4">
                    </div>
                    <div class="form-group">
                        <label>Tipo de Usuário</label>
                        <select id="newUserType">
                            <option value="usuario">Usuário Comum</option>
                            <option value="ADMIN">Administrador</option>
                        </select>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn-primary">Cadastrar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
